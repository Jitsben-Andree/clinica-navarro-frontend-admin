<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-900 via-gray-900 to-slate-800 font-sans p-4 sm:p-6 md:p-12">
  
  <div class="w-full max-w-5xl bg-white/90 backdrop-blur-md rounded-[2rem] shadow-2xl overflow-hidden grid grid-cols-1 md:grid-cols-12 min-h-[580px] border border-white/20">
    
    <!-- COLUMNA IZQUIERDA - FORMULARIO -->
    <div class="md:col-span-5 p-8 sm:p-10 flex flex-col justify-between bg-white/95 backdrop-blur-sm text-gray-800">
      
      <!-- Logo / Marca - Icono de Diente elegante -->
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-gradient-to-br from-indigo-600 to-purple-700 rounded-xl flex items-center justify-center shadow-lg">
          <!-- Icono de DIENTE elegante -->
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5c-4.5 0-6 3-6 6 0 2.5 1.5 4.5 3 6 .5.5 1 1 1.5 1.5.5.5 1 1.5 1 2.5 0 1 .5 1.5 1 1.5s1-.5 1-1.5c0-1 .5-2 1-2.5.5-.5 1-1 1.5-1.5 1.5-1.5 3-3.5 3-6 0-3-1.5-6-6-6z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 9h.01M15 9h.01" />
          </svg>
        </div>
        <div>
          <span class="text-sm font-black text-gray-800 tracking-tight leading-none uppercase">Clínica Dental</span>
          <span class="block text-xs font-bold bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent">NAVARRO</span>
        </div>
      </div>

      <!-- Formulario -->
      <div class="w-full max-w-xs mx-auto my-auto py-8">
        
        <!-- Icono de USUARIO (persona/perfil) -->
        <div class="flex justify-center mb-8">
          <div class="w-20 h-20 rounded-full bg-gradient-to-br from-indigo-600 to-purple-700 flex items-center justify-center text-white shadow-xl ring-4 ring-indigo-100">
            <!-- Icono de PERSONA/USUARIO -->
            <svg class="w-10 h-10" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M17.982 18.725A7.488 7.488 0 0 0 12 15.75a7.488 7.488 0 0 0-5.982 2.975m11.963 0a9 9 0 1 0-11.963 0m11.963 0A8.966 8.966 0 0 1 12 21a8.966 8.966 0 0 1-5.982-2.275M15 9.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0z" />
            </svg>
          </div>
        </div>

        <!-- Mensaje de error -->
        @if (mensajeError()) {
          <div class="mb-4 text-center animate-shake bg-rose-50 border border-rose-200 rounded-2xl py-2 px-3">
            <p class="text-xs text-rose-600 font-medium">{{ mensajeError() }}</p>
          </div>
        }

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
          
          <!-- Campo Email -->
          <div class="relative group">
            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-indigo-600 transition-colors">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25H4.5a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5H4.5a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75" />
              </svg>
            </span>
            <input 
              type="email" 
              formControlName="email"
              class="w-full pl-10 pr-4 py-3 border-2 border-gray-100 rounded-2xl text-sm font-medium text-gray-700 placeholder-gray-400 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all bg-gray-50/50"
              placeholder="correo@ejemplo.com"
            >
          </div>

          <!-- Campo Password -->
          <div class="relative group">
            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-indigo-600 transition-colors">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" />
              </svg>
            </span>
            <input 
              [type]="mostrarPassword() ? 'text' : 'password'"
              formControlName="password"
              class="w-full pl-10 pr-12 py-3 border-2 border-gray-100 rounded-2xl text-sm font-medium text-gray-700 placeholder-gray-400 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all bg-gray-50/50"
              placeholder="••••••••"
            >
            <button 
              type="button"
              (click)="togglePassword()"
              class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-indigo-600 transition-colors"
            >
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
              </svg>
            </button>
          </div>

          <!-- Recordar sesión -->
          <div class="flex items-center justify-between mt-3">
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" class="accent-indigo-600 rounded-md w-3.5 h-3.5">
              <span class="text-xs text-gray-500 font-medium">Recordar sesión</span>
            </label>
            <a href="#" class="text-xs text-indigo-600 hover:text-indigo-700 font-medium transition-colors">¿Olvidaste tu contraseña?</a>
          </div>

          <!-- Botón Login -->
          <button 
            type="submit" 
            [disabled]="cargando()"
            class="w-full py-3 bg-gradient-to-r from-indigo-600 to-purple-700 hover:from-indigo-700 hover:to-purple-800 text-white text-sm font-bold tracking-wide rounded-2xl transition-all uppercase shadow-lg hover:shadow-xl disabled:opacity-50 mt-2"
          >
            @if (cargando()) {
              <span class="flex items-center justify-center gap-2">
                <span class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
                <span>Ingresando...</span>
              </span>
            } @else {
              Iniciar Sesión
            }
          </button>
        </form>

      </div>

      <!-- Indicadores -->
      <div class="flex justify-center gap-2">
        <span class="w-1.5 h-1.5 rounded-full bg-gray-300"></span>
        <span class="w-5 h-1.5 rounded-full bg-indigo-600"></span>
        <span class="w-1.5 h-1.5 rounded-full bg-gray-300"></span>
      </div>

    </div>

    <!-- COLUMNA DERECHA - FONDO BONITO -->
    <div class="hidden md:block md:col-span-7 relative overflow-hidden text-white">
      
      <div class="absolute inset-0 bg-cover bg-center scale-110"
           style="background-image: url('https://images.unsplash.com/photo-1588776814546-1ffcf47267a5?ixlib=rb-4.0.3&auto=format&fit=crop&w=1200&q=80');">
      </div>
      <div class="absolute inset-0 bg-gradient-to-br from-indigo-950/80 via-slate-900/70 to-purple-950/80"></div>
      
      <div class="absolute inset-0 opacity-20" style="background-image: radial-gradient(circle at 1px 1px, white 1px, transparent 1px); background-size: 24px 24px;"></div>

      <div class="relative z-10 flex flex-col justify-between h-full p-12">
        
        

        <div class="max-w-md ml-auto text-right mt-auto mb-12">
          <div class="inline-block mb-4 px-3 py-1 bg-white/10 backdrop-blur-sm rounded-full text-[10px] font-medium tracking-wider text-white/80">
            Portal Digital (Empleados)
          </div>
          <h1 class="text-7xl font-black tracking-tight mb-4 bg-gradient-to-r from-white to-indigo-200 bg-clip-text text-transparent drop-shadow-2xl">
            Bienvenido.
          </h1>
          <p class="text-sm text-white/80 font-light leading-relaxed max-w-xs ml-auto">
            Accede a tu portal dental y gestiona tus citas, historial clínico y más de forma fácil y segura.
          </p>
          <div class="mt-8 flex justify-end gap-2">
            <div class="w-8 h-0.5 bg-indigo-400 rounded-full"></div>
            <div class="w-12 h-0.5 bg-white rounded-full"></div>
            <div class="w-8 h-0.5 bg-indigo-400 rounded-full"></div>
          </div>
          
        </div>

        

      </div>

    </div>

  </div>
</div>
