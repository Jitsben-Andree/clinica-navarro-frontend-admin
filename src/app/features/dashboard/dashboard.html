<div class="flex h-screen bg-gray-100 font-sans">

  <!-- ================= SIDEBAR (Menú Lateral) ================= -->
  <aside class="w-64 bg-blue-900 text-white flex flex-col shadow-xl z-10">
    <!-- Logo / Marca -->
    <div class="h-16 flex items-center justify-center border-b border-blue-800">
      <h1 class="text-xl font-bold tracking-wider">Clínica Navarro</h1>
    </div>

    <!-- Navegación -->
    <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
      
      <a routerLink="/dashboard" routerLinkActive="bg-blue-800 border-l-4 border-blue-300" [routerLinkActiveOptions]="{exact: true}" class="flex items-center gap-3 px-4 py-3 rounded hover:bg-blue-800 transition-all">
        <span>🏠</span> <span class="font-medium">Inicio</span>
      </a>
      
      <!-- Las demás rutas las crearemos pronto -->
      <a routerLink="/dashboard/pacientes" routerLinkActive="bg-blue-800 border-l-4 border-blue-300" class="flex items-center gap-3 px-4 py-3 rounded hover:bg-blue-800 transition-all">
        <span>👥</span> <span class="font-medium">Pacientes</span>
      </a>
      
      <a routerLink="/dashboard/citas" routerLinkActive="bg-blue-800 border-l-4 border-blue-300" class="flex items-center gap-3 px-4 py-3 rounded hover:bg-blue-800 transition-all">
        <span>📅</span> <span class="font-medium">Citas</span>
      </a>
      
      <a routerLink="/dashboard/catalogo" routerLinkActive="bg-blue-800 border-l-4 border-blue-300" class="flex items-center gap-3 px-4 py-3 rounded hover:bg-blue-800 transition-all">
        <span>💰</span> <span class="font-medium">Precios</span>
      </a>

      <a routerLink="/dashboard/inventario" routerLinkActive="bg-blue-800 border-l-4 border-blue-300" class="flex items-center gap-3 px-4 py-3 rounded hover:bg-blue-800 transition-all">
        <span>📦</span> <span class="font-medium">Inventario</span>
      </a>
    </nav>

    <!-- Perfil y Salida -->
    <div class="p-4 border-t border-blue-800 bg-blue-950">
      <div class="text-sm text-blue-200 mb-3 truncate flex items-center gap-2">
        <span>👤</span> {{ emailUsuario }}
      </div>
      <button (click)="cerrarSesion()" class="w-full flex items-center justify-center gap-2 bg-red-500 hover:bg-red-600 px-4 py-2 rounded text-sm font-bold transition-colors shadow-md">
        <span>🚪</span> Cerrar Sesión
      </button>
    </div>
  </aside>

  <!-- ================= CONTENIDO PRINCIPAL ================= -->
  <main class="flex-1 flex flex-col overflow-hidden relative">
    
    <!-- Header simple superior -->
    <header class="h-16 bg-white shadow-sm flex items-center px-8 border-b border-gray-200 z-0">
      <h2 class="text-lg font-semibold text-gray-700">Panel Administrativo</h2>
    </header>

    <!-- ÁREA DINÁMICA: Aquí adentro se dibujará la pantalla de Pacientes, Citas, etc. -->
    <div class="flex-1 overflow-auto p-8 bg-gray-50">
      <router-outlet></router-outlet>
    </div>

  </main>

</div>
